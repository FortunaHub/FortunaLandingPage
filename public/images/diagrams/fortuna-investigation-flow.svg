<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-labelledby="title description"><title id="title">Fortuna · evidence and investigation flow</title><desc id="description">Inventory and optional observations are collected, stored and processed. Coverage is checked before interpreting evidence. Investigators choose a fix, apply it outside Fortuna and verify fresh authorization and path evidence after reconciliation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b4c7"/></marker></defs><rect width="960" height="1200" rx="20" fill="#0c1019"/><text x="40" y="49" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f4f7fc">Fortuna · evidence and investigation flow</text><text x="40" y="79" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#b8c3d4">From cluster evidence to a reviewed fix · collection and reconciliation are asynchronous</text><rect x="40" y="110" width="880" height="375" rx="14" fill="#111827" stroke="#354155"/><text x="60" y="140" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb">FORTUNA · collect and process</text><rect x="70" y="170" width="240" height="98" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="190.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1 · Collect</text><text x="190.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Inventory · RBAC · SBOM</text><text x="190.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Available runtime / network</text><rect x="360" y="170" width="240" height="98" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="480.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">2 · Ingest and store</text><text x="480.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Agent → Core</text><text x="480.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Cluster-scoped evidence</text><rect x="650" y="170" width="240" height="98" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="770.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">3 · Process</text><text x="770.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Queued matching and risk</text><text x="770.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Build path relationships</text><path d="M 310 218 L 360 218" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 600 218 L 650 218" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><rect x="360" y="355" width="240" height="92" rx="10" fill="#34182b" stroke="#e95591" stroke-width="1.5" /><text x="480.0" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">4 · Check coverage</text><text x="480.0" y="409" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Sync · catalog · sensors</text><text x="480.0" y="431" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Scope and timestamps</text><path d="M 770 268 L 770 313 L 480 313 L 480 355" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><rect x="40" y="525" width="880" height="570" rx="14" fill="#111827" stroke="#354155"/><text x="60" y="555" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb">INVESTIGATOR + CLUSTER OWNER · interpret, change, verify</text><rect x="70" y="590" width="260" height="108" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="200.0" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Coverage incomplete</text><text x="200.0" y="644" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Fix ingestion or filters</text><text x="200.0" y="666" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Wait for fresh collection</text><rect x="390" y="590" width="270" height="108" rx="10" fill="#34182b" stroke="#e95591" stroke-width="1.5" /><text x="525.0" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">5 · Investigate</text><text x="525.0" y="644" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Finding → workload → path</text><text x="525.0" y="666" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Inspect contributing evidence</text><path d="M 430 447 L 430 503 L 200 503 L 200 590" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="90" y="492" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">missing / stale</text><path d="M 525 447 L 525 590" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="541" y="545" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">coverage understood</text><rect x="390" y="775" width="270" height="108" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="525.0" y="804" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">6 · Review and apply fix</text><text x="525.0" y="829" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Cluster owner changes RBAC</text><text x="525.0" y="851" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">through normal change control</text><path d="M 525 698 L 525 775" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><rect x="390" y="955" width="270" height="108" rx="10" fill="#34182b" stroke="#e95591" stroke-width="1.5" /><text x="525.0" y="984" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">7 · Verify fresh evidence</text><text x="525.0" y="1009" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Check authorization again</text><text x="525.0" y="1031" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Wait for sync + reconciliation</text><path d="M 525 883 L 525 955" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 660 1009 L 865 1009 L 865 643 L 660 643" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="677" y="1029" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">recheck path and findings</text><path d="M 70 644 L 55 644 L 55 327 L 360 327 L 360 400" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="70" y="1126" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b8c3d4">The fix is applied outside Fortuna. Screenshots do not demonstrate a completed remediation.</text><text x="70" y="1152" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b8c3d4">An inferred permission path is not proof of exploitation; zero CVEs requires valid matching coverage.</text></svg>