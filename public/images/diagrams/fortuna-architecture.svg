<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-labelledby="title description"><title id="title">Fortuna · high-level architecture</title><desc id="description">Monitored cluster inventory and optional Falco telemetry feed the Agent. Local and remote Agents send evidence to Core. Dashboard reads Core APIs. Core uses PostgreSQL and NATS with workers for processing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b4c7"/></marker></defs><rect width="960" height="1060" rx="20" fill="#0c1019"/><text x="40" y="49" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f4f7fc">Fortuna · high-level architecture</text><text x="40" y="79" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#b8c3d4">Logical responsibilities and evidence paths · optional collectors depend on deployment</text><rect x="40" y="110" width="880" height="205" rx="14" fill="#111827" stroke="#354155"/><text x="60" y="140" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb">MONITORED CLUSTER · also applicable to the management cluster</text><rect x="70" y="170" width="240" height="96" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="190.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Kubernetes workloads</text><text x="190.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Inventory · identities · RBAC</text><text x="190.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Container images / SBOM</text><rect x="370" y="170" width="240" height="96" rx="10" fill="#34182b" stroke="#e95591" stroke-width="1.5" /><text x="490.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Fortuna Agent</text><text x="490.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">DaemonSet on nodes</text><text x="490.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Collect and send evidence</text><rect x="670" y="170" width="220" height="96" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="780.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Optional Falco</text><text x="780.0" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Runtime event input</text><text x="780.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">When installed and healthy</text><path d="M 310 218 L 370 218" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><path d="M 670 218 L 610 218" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="350" y="365" width="570" height="635" rx="14" fill="#111827" stroke="#354155"/><text x="370" y="395" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb"></text><text x="680" y="395" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb">MANAGEMENT CLUSTER</text><rect x="390" y="435" width="240" height="92" rx="10" fill="#34182b" stroke="#e95591" stroke-width="1.5" /><text x="510.0" y="464" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Fortuna Core</text><text x="510.0" y="489" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">API · evidence ingest</text><text x="510.0" y="511" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Coordinate processing</text><rect x="680" y="435" width="200" height="92" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="780.0" y="464" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Dashboard</text><text x="780.0" y="489" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Browser interface</text><text x="780.0" y="511" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Reads Core APIs</text><path d="M 680 477 L 630 477" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="644" y="459" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#b8c3d4">API</text><path d="M 490 266 L 490 435" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="505" y="343" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">gRPC / mTLS</text><rect x="40" y="375" width="275" height="195" rx="14" fill="#111827" stroke="#354155"/><text x="60" y="405" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6deeb">REMOTE CLUSTER(S) · optional</text><rect x="62" y="430" width="230" height="102" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="177.0" y="459" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Remote Agent</text><text x="177.0" y="484" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Same collection model</text><text x="177.0" y="506" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Optional runtime sensors</text><path d="M 292 480 L 390 480" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="56" y="595" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b8c3d4">Remote Agents require Core</text><text x="56" y="617" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b8c3d4">connectivity and trusted credentials.</text><rect x="390" y="650" width="240" height="92" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="510.0" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">PostgreSQL</text><text x="510.0" y="704" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Persistent evidence</text><text x="510.0" y="726" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">and application state</text><rect x="680" y="650" width="200" height="92" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="780.0" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">NATS JetStream</text><text x="780.0" y="704" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Asynchronous</text><text x="780.0" y="726" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">processing queue</text><rect x="680" y="850" width="200" height="92" rx="10" fill="#1b2638" stroke="#64748b" stroke-width="1.5" /><text x="780.0" y="879" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Core workers</text><text x="780.0" y="904" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Matching · risk</text><text x="780.0" y="926" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#c4cfdf">Path processing</text><path d="M 450 527 L 450 650" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="463" y="603" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">persist / read</text><path d="M 565 527 L 565 583 L 780 583 L 780 650" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="668" y="570" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">enqueue work</text><path d="M 780 742 L 780 850" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="795" y="806" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">consume</text><path d="M 680 898 L 510 898 L 510 742" fill="none" stroke="#a8b4c7" stroke-width="2" marker-end="url(#arrow)" /><text x="535" y="884" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#d5deed">persist results</text><text x="40" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b8c3d4">Solid arrows: data/API interaction     Dashed arrow: optional sensor input</text></svg>